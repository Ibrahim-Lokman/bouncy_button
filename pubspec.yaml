name: bouncy_button
description: A customizable 3D push button with async loading states, springs, button groups, and full accessibility, plus a bouncy press effect for any widget.
version: 2.2.0
homepage: https://github.com/Ibrahim-Lokman/bouncy_button
repository: https://github.com/Ibrahim-Lokman/bouncy_button
issue_tracker: https://github.com/Ibrahim-Lokman/bouncy_button/issues
documentation: https://github.com/Ibrahim-Lokman/bouncy_button/blob/main/README.md

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Used only by package:bouncy_button/testing.dart. Apps already have it for
  # their own tests, and release builds don't include it.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

screenshots:
  - description: Bouncy buttons with a 3D press, in different depths and shapes.
    path: screenshots/feature-press.png
  - description: A pay button showing a spinner and "Paying…" while it works.
    path: screenshots/feature-loading.png
  - description: Filled, tonal, outlined, ghost, and destructive buttons, in three sizes.
    path: screenshots/feature-styles.png
  - description: Frosted glass buttons over a colorful background.
    path: screenshots/feature-glass.png

topics:
  - button
  - widget
  - animation
  - material-design
