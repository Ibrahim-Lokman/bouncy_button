name: bouncy_button
description: A highly customizable Flutter button widget with engaging 3D depth effects, smooth animations, and extensive styling options.
version: 2.0.0
homepage: https://github.com/Ibrahim-Lokman/bouncy_button
repository: https://github.com/Ibrahim-Lokman/bouncy_button
issue_tracker: https://github.com/Ibrahim-Lokman/bouncy_button/issues
documentation: https://github.com/Ibrahim-Lokman/bouncy_button/blob/main/README.md

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

screenshots:
  - description: Basic and animated BouncyButton styles in a light theme.
    path: screenshots/ss1.png
  - description: Animated and styled BouncyButton variants in a dark theme.
    path: screenshots/ss3.png

topics:
  - button
  - widget
  - animation
  - material-design
